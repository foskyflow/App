name: Avisos con la app cerrada

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:         # botón "Run workflow": envía una notificación de prueba

permissions:
  contents: write            # para guardar el estado y el historial en la rama "datos"

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Recuperar estado anterior
        run: |
          mkdir -p datos
          if git fetch -q --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" datos; then
            git show FETCH_HEAD:estado.json > datos/estado.json 2>/dev/null || true
            git show FETCH_HEAD:historial.json > datos/historial.json 2>/dev/null || true
          else
            echo "Primera ejecución: aún no hay datos guardados"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Comprobar precios y avisar
        run: node vigilante/vigilar.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Guardar estado e historial
        if: always()
        run: |
          cd datos
          [ -f estado.json ] || exit 0
          git init -q -b datos
          git add estado.json historial.json
          git -c user.name="vigilante" -c user.email="vigilante@users.noreply.github.com" commit -qm "Datos de precios"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" datos
        env:
          GH_TOKEN: ${{ github.token }}
